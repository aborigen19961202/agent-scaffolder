[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-scaffolder"
version = "0.1.0"
description = "Deterministic repository scaffolder and operational rules generator for autonomous LLM agents."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "aborigen19961202" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
agent-scaffold = "agent_scaffolder.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
